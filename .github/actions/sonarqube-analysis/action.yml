name: 'Sonarqube analysis'
description: 'Run job to analys the PR with SonarQube'

runs:
  using: "composite"
  steps:
    - name: Checkout
      uses: actions/checkout@v3
      with:
        fetch-depth: '0'
    - name: Change wrapper permissions
      run: chmod +x ./gradlew
      shell: bash
    - name: Download build
      uses: actions/download-artifact@v4
      with:
        name: "build-out"
    - name: Cache SonarQube packages
      uses: actions/cache@v4
      with:
        path: ~/.sonar/cache
        key: ${{ runner.os }}-sonar
        restore-keys: ${{ runner.os }}-sonar
    - name: Prepare artifact for scanning
      run: unzip build.zip
      shell: bash
    - name: SonarQube Scan
      run: |
        ./gradlew sonar -Dsonar.projectKey=sonata-piano \
          -Dsonar.scm.provider=git \
          -Dsonar.scm.revision=${{ github.event.pull_request.head.sha }} \
          -Dsonar.pullrequest.key=${{ github.event.number }} \
          -Dsonar.pullrequest.branch=${{ github.ref_name }} \
          -Dsonar.pullrequest.base=master
      env:
        GITHUB_USERNAME: ${{ secrets.GH_USERNAME }}
        GITHUB_ACCESS_TOKEN: ${{ secrets.GH_ACCESS_TOKEN }}
        SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
      shell: bash
    - name: Generate Sonarqube report
      id: 'quality-gate-check'
      uses: phwt/sonarqube-quality-gate-action@v1
      with:
        sonar-project-key: sonata-piano
        sonar-host-url: ${{ secrets.SONAR_HOST_URL }}
        sonar-token: ${{ secrets.SONAR_TOKEN }}
        pull-request: ${{ github.event.number }}
        disable-pr-comment: 'false'
        github-token: ${{ secrets.GITHUB_TOKEN }}
    - name: Output result
      run: |
        echo "${{ steps.quality-gate-check.outputs.project-status }}"
        echo "${{ steps.quality-gate-check.outputs.quality-gate-result }}"