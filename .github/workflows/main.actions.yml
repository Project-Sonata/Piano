name: tests

on:
  push:
    branches:
      - master

env:
  GITHUB_USERNAME: ${{ secrets.GH_USERNAME }}
  GITHUB_ACCESS_TOKEN: ${{ secrets.GH_ACCESS_TOKEN }}

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v3
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v5
      - name: Run tests
        uses: ./.github/actions/tests