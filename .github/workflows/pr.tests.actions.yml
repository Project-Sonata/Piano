name: tests

on:
  pull_request:
    branches:
      - master
    paths:
      - "src/**"
      - "Dockerfile.test"
      - "Dockerfile.test.mutation"
      - "build.gradle"

env:
  GH_USERNAME: ${{ secrets.GH_USERNAME }}
  GH_ACCESS_TOKEN: ${{ secrets.GH_ACCESS_TOKEN }}


permissions:
  pull-requests: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Say hello
        run: echo "Hello world!"
