name: tests

on:
  pull_request:
    branches:
      - master
    paths:
      - "src/**"
      - "Dockerfile.test"
      - "Dockerfile.test.mutation"
      - "build.gradle"
      - ".github/workflows/pr.tests.actions.yml"
      - ".github/actions/tests/action.yml"

env:
  GITHUB_USERNAME: ${{ secrets.GH_USERNAME }}
  GITHUB_ACCESS_TOKEN: ${{ secrets.GH_ACCESS_TOKEN }}


permissions:
  pull-requests: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: 17
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v5
      - name: Run tests
        uses: ./.github/actions/tests
      - name: Upload JaCoCo report
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-report
          path: build/reports/jacoco/test/jacocoTestReport.xml
  sonarqube:
    runs-on: ubuntu-latest
    needs: test
    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 2
    - name: Fetch master branch
      run: git fetch origin master:refs/remotes/origin/master
    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v5
    - name: Download JaCoCo report
      uses: actions/download-artifact@v4
      with:
        name: jacoco-report
        path: build/reports/jacoco/test/
    - name: Run SonarQube analysis with report
      uses: ./.github/actions/sonarqube-analysis
      with:
        gh_username: ${{ secrets.GITHUB_USERNAME }}
        github-token: ${{ secrets.GITHUB_TOKEN }}
        sonar-host-url: ${{ secrets.SONAR_HOST_URL }}
        sonar-token: ${{ secrets.SONAR_TOKEN }}
