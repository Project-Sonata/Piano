name: sonata-piano

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master

env:
  GH_USERNAME: ${{ secrets.GH_USERNAME }}
  GH_ACCESS_TOKEN: ${{ secrets.GH_ACCESS_TOKEN }}

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v3
      - name: Run tests
        run: bash run-tests.sh
      - name: Where am I
        run: pwd
      - name: Check content
        run: ls
      - name: try cd
        run: cd reports
      - name: reports content
        run: ls
      - name: Upload JaCoCo artifact
        uses: actions/upload-artifact@v4
        with:
          name: jacocoTestReport.xml
          path: /reports/jacocoTestReport.xml