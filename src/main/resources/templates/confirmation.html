<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Email Confirmation Code</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #0e0e0e;
            color: #cccccc;
            margin: 0;
            padding: 20px;
        }
        .container {
            max-width: 600px;
            margin: auto;
            background-color: #1a1a1a;
            border-radius: 8px;
            padding: 30px;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.5);
        }
        h2 {
            color: #66bb6a;
        }
        .code {
            display: inline-block;
            background-color: #2a2a2a;
            color: #a5d6a7;
            font-size: 24px;
            font-weight: bold;
            padding: 12px 24px;
            border-radius: 6px;
            letter-spacing: 4px;
            margin: 20px 0;
            border: 1px solid #4caf50;
        }
        p {
            line-height: 1.6;
        }
        .footer {
            font-size: 12px;
            color: #666666;
            margin-top: 30px;
            text-align: center;
        }
    </style>
</head>
<body>
<div class="container">
    <h2>Email Confirmation</h2>
    <p>Thank you for signing up!</p>
    <p>Please enter the confirmation code below to verify your email address:</p>

    <div class="code" th:text="${confirmationCode}">123456</div>

    <p>If you didn’t request this code, you can safely ignore this message.</p>
    <p>Regards,<br>The Sonata Team</p>

    <div class="footer">
        &copy; 2025 Sonata. All rights reserved.
    </div>
</div>
</body>
</html>
